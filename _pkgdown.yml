url: https://clement-poupelin.github.io/corrkit/
lang: fr

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#2166AC"
    link-color: "#2166AC"
    code-color: "#B2182B"

home:
  title: "corrkit : analyses de corrélation avec heatmaps et tableaux annotés"
  description: >
    Une couche légère au-dessus de stats, ppcor, psych et correlation : famille
    d'ajustement explicite, traitement des variables binaires, graphiques et
    tableaux qui disent ce qu'ils montrent.
  sidebar:
    structure: [links, license, citation, authors, dev]

authors:
  Clément Poupelin:
    href: https://orcid.org/0009-0005-7308-0368

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    articles:
      text: Vignettes
      menu:
      - text: Corrélations croisées et partielles
        href: articles/partial-cross.html
      - text: Variables binaires
        href: articles/binary-variables.html

articles:
- title: Vignettes
  navbar: ~
  contents:
  - corrkit
  - partial-cross
  - binary-variables

reference:
- title: Calculer
  desc: >
    Chaque fonction appelle un moteur existant (stats, ppcor, psych,
    correlation) et ajuste les p-values sur une famille explicite.
  contents:
  - cor_test_matrix
  - cor_cross
  - partial_cor_test
  - cor_binary_effects
- title: Graphiques
  desc: Objets ggplot, avec sous-titre (méthode, moteur, N) et légende de lecture.
  contents:
  - plot_cor_heatmap
  - plot_cor_cross
  - plot_cor_pair
- title: Tableaux
  desc: Tableaux gt, même échelle de couleurs que les heatmaps, notes de bas de tableau.
  contents:
  - starts_with("tbl_")
- title: Notes de lecture et utilitaires
  contents:
  - cor_binary_note
  - cor_var_type
  - as_cor_numeric
  - mark_binary
  - p_to_stars
  - theme_pub
  - COR_PAL
- title: Données d'exemple
  contents:
  - simulate_cor_data

news:
  cran_dates: false
